        /* --- RESET & BASE --- */
        * {

        body {

        /* --- CUSTOM TEXT SELECTION --- */
        ::selection {

        }

        /* Firefox compatibility (optional but good practice) */
        ::-moz-selection {
            background-color: #ffcc00;

		/* --- LAYOUT CONTAINER --- */
		.scene-container {
			position: relative;

			position: relative; /* Must be positioned for z-index to work */
			z-index: 20;
			width: 100%;
			height: 100%;
			display: block;
			pointer-events: none; /* Allows you to click text "through" the hole if needed */

        /* --- NEW WRAPPER --- */
		.retro-container {
			position: relative;
    
			/* 1. YOUR EXACT IMAGE DIMENSIONS */
			--img-width: 2752; 
			--img-height: 1535;

			/* 2. THE MATH (Keeps the aspect ratio locked) */
			width: min(100vw, calc(100vh * (var(--img-width) / var(--img-height))));
			height: min(100vh, calc(100vw * (var(--img-height) / var(--img-width))));
		}

		/* --- THE MONITOR SCREEN --- */
		.monitor-screen {
			position: absolute;
			z-index: 1;

        /* --- RETRO AESTHETICS --- */
        :root {
            --amber: #ffcc00; /* Yellowish/gold amber */
            --amber-dim: #997a00;
            --scanline-color: rgba(0, 0, 0, 0.5);

        .crt-content {
            width: 100%;

            background-color: #120d00;
            color: var(--amber);
            padding: 20px;
            font-size: 12px;
            line-height: 1.3;
            overflow-y: auto;
            overflow-x: hidden;
            
            text-shadow: 0 0 2px var(--amber-dim), 0 0 5px var(--amber);
            scrollbar-width: thin;
            scrollbar-color: var(--amber) #120d00;
        }

        .crt-content::-webkit-scrollbar {
            width: 8px;
        }
        .crt-content::-webkit-scrollbar-track {
            background: #120d00;
        }
        .crt-content::-webkit-scrollbar-thumb {
            background-color: var(--amber);
            border: 1px solid #120d00;
        }

        /* Scanlines */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
            opacity: 0.6;
        }

        /* Flicker */
        .flicker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 176, 0, 0.02);
            opacity: 0;
            z-index: 21;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.02; }
            50% { opacity: 0.05; }
            100% { opacity: 0.02; }
        }

        /* --- CONTENT STYLING --- */
        h1, h2, h3 {
            margin-bottom: 10px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--amber);
            display: inline-block;

        .tab {

        /* --- HYPERLINK STYLING --- */

        /* Optional: Cool retro hover effect */
        .crt-content a:hover {
            background-color: #ffcc00; /* Amber block */
            color: #000;               /* Black text */
            text-decoration: none;
        }

        /* --- RETRO IMAGE STYLING --- */
        .crt-content img {
           max-width: 100%;       /* Prevent it from overflowing the screen */
           height: auto;          /* Maintain aspect ratio */
            display: block;        /* Put it on its own line */
          margin: 15px 0;        /* Space above and below */
          border: 2px solid #ffcc00; /* Amber border */

           /* THE MAGIC FILTER: Turns any image into "Amber Monochrome" */
           filter: grayscale(100%) sepia(100%) hue-rotate(5deg) saturate(400%) contrast(1.2);
    
          /* Optional: Add a subtle glow to the image too */
           box-shadow: 0 0 5px rgba(255, 204, 0, 0.5);

           /* Authentic "Low Res" look */
            image-rendering: pixelated; 
        }

        /* --- TEXT WRAPPING STYLES --- */
        .crt-content img.float-right {
           float: right;             /* The magic command */
           margin: 5px 0 15px 20px; /* Adds breathing room to the Right and Bottom */
           max-width: 40%;          /* Keep it small enough for text to fit next to it */
           display: inline;         /* Let it sit with text */
    
           /* Keep the retro border/filter from your main img rule */
          /* If you want to tweak it specifically for these small ones, add overrides here */
        }

        .crt-content img.float-left {
           float: left;             /* The magic command */
           margin: 5px 20px 15px 0; /* Adds breathing room to the Right and Bottom */
           max-width: 40%;          /* Keep it small enough for text to fit next to it */
           display: inline;         /* Let it sit with text */
    
           /* Keep the retro border/filter from your main img rule */
          /* If you want to tweak it specifically for these small ones, add overrides here */
        }

        figure.float-right {
          float: right;
          clear: right; /* Forces this image to drop below any previous right-floated images */
           margin: 5px 0 15px 20px; /* Space on right */
           max-width: 40%;
           
          display: table; /* Helps constrain width to image size */
        }

        figure.float-left {
         float: left;
         clear: left; /* Forces this image to drop below any previous left-floated images */
         margin: 5px 20px 15px 0; /* Space on left */
         max-width: 40%;
         
         display: table;
        }

        /* Style the image INSIDE the figure */
        figure img {
            width: 100%; /* Fill the figure container */
         height: auto;
         display: block;
         border: 2px solid #ffcc00; /* Your retro border */
            
         /* YOUR RETRO FILTER (Moved here) */

        /* Style the Caption Text */
        figcaption {

            margin-right: auto;

        /* --- RESPONSIVE MOBILE TWEAKS --- */
        @media (max-width: 768px) {
            /* TABLETS & LARGE PHONES */
    
            .crt-content {
                font-size: 11px; /* Courier New is wide, so we need to go small */
                padding: 10px;   /* Less padding = more room for text */
                line-height: 1.1;
            }

                margin-right: 5px;
                padding: 2px 2px;
                font-size: 10px; /* Navigation needs to be even smaller to fit */
            }

                margin-bottom: 5px;

            /* Force images to stack on mobile (no room for side-by-side) */
            figure.float-right, figure.float-left {
                float: none;
                max-width: 80%; /* Let images take up most of the width */
                margin: 10px auto; /* Center them */
                display: block;
            }
        }

        /* --- SMALL PHONES (Portrait Mode) --- */
        @media (max-width: 480px) {

            /* 1. Enable Scrolling on the parent container */
            .scene-container {
                overflow: auto; /* Auto = Show scrollbars if image is too big */
                justify-content: flex-start; /* Align left so you scroll to the right */
                align-items: center; /* Keep it vertically centered */
            }

            /* 2. Size the monitor by Height, not Width */
            .retro-container {
                /* Make the monitor take up 55% of the screen height */
                height: 55vh; 
        
                /* Calculate the width naturally based on that height (No Squishing!) */
                width: calc(55vh * (var(--img-width) / var(--img-height)));
        
                /* Prevent flexbox from crushing it */
                flex-shrink: 0;
        
                /* Center it horizontally in the scroll area */
                margin: 0 auto;
            }

            /* 3. Text Sizing */
            .crt-content {
                /* Since the monitor is bigger now (zoomed in), we can bump the text up slightly */
                font-size: 10px; 
                padding: 5px;   
                line-height: 1.1; 
            }

            .nav-link {
                display: inline-block; 
                margin-right: 5px;
                font-size: 10px;

            h1 {

        /* --- 88x31 BUTTON GRID --- */

    <script>

        /* --- AUDIO SYSTEM --- */
        const humAudio = document.getElementById("bg-audio");
        const clickSource = "mouse_click.mp3"; 

        // 1. SETUP BACKGROUND HUM
        const baseVolume = 0.5; // The normal volume level
        humAudio.volume = baseVolume; 

        /* --- AUDIO TOGGLE SYSTEM --- */
        let isAudioEnabled = true; // Default to ON

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled; // Flip state

            // 1. Update Button Text
            const btn = document.getElementById('audio-toggle');
            btn.innerText = isAudioEnabled ? "[AUDIO: ON]" : "[AUDIO: OFF]";

            // 2. Handle Background Hum
            // We use .muted instead of .pause so the loop keeps running silently
            humAudio.muted = !isAudioEnabled; 

            // 3. Play a confirmation click (only if we just turned it ON)
            if (isAudioEnabled) playClickSound();
        }

        // Custom Loop: When finished, go back to 10s
        humAudio.addEventListener('ended', function() {
            this.currentTime = 10; 
            this.play();           
        });

        // Attempt Auto-play
        const playPromise = humAudio.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => {
                // If blocked, wait for first interaction
               document.addEventListener('click', () => {
                   humAudio.play();
               }, { once: true });
          });
       }

      /* --- NEW: FADE OUT ON TAB SWITCH --- */
      let fadeTimer;

      function fadeAudio(targetVolume) {
          // Clear any currently running fade to prevent "fighting"
          if (fadeTimer) clearInterval(fadeTimer);

          fadeTimer = setInterval(() => {
              let current = humAudio.volume;

              // If we are close enough to the target, snap to it and stop
              if (Math.abs(current - targetVolume) < 0.02) {
                  humAudio.volume = targetVolume;
                  clearInterval(fadeTimer);
              } else {
                  // Otherwise, move volume towards target by 0.02 step
                  if (current > targetVolume) {
                      humAudio.volume = Math.max(0, current - 0.02);
                  } else {
                      humAudio.volume = Math.min(baseVolume, current + 0.02);
                  }
              }
          }, 50); // Run every 50ms for a smooth fade
      }

        // 2. SETUP CLICK SOUNDS
        function playClickSound() {
            // We create a new Audio object for every click so they can overlap 
            // (if the user clicks fast, it won't cut off the previous sound)
            // Only play if audio is enabled!
            if (isAudioEnabled) {
                const sound = new Audio(clickSource);
                sound.volume = 0.3;
                sound.play();
            }
        }

        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
              fadeAudio(0); // Tab hidden? Fade to 0
          } else {
              fadeAudio(baseVolume); // Tab back? Fade to 0.5
          }
      });

        // Attach click sound to all nav links
        document.addEventListener('click', function(e) {
        // Check if the clicked element (or its parent) is an <a> tag
            if (e.target.closest('a')) {
                playClickSound();
            }
        });

       /* --- ANIMATION TOGGLE SYSTEM --- */
        let isAnimEnabled = true; 
        let currentPageId = 'home'; // NEW: Track the current page

            isAnimEnabled = !isAnimEnabled; // Flip the state
        
            // Update the button text
            const btn = document.getElementById('anim-toggle');
            btn.innerText = isAnimEnabled ? "[FX: ON]" : "[FX: OFF]";
        
            // Optional: Play click sound
            playClickSound();

            // NEW LOGIC: If we just turned it OFF, reload the page instantly
            if (!isAnimEnabled) {
                // Because isAnimEnabled is now false, calling this will 
                // trigger the "Instant Load" logic we wrote earlier.
                navigate(currentPageId);
            }

        }

        // --- CONTENT LOGIC ---

        const displayElement = document.getElementById('content-display');
    let currentTimeout; // To track and stop typing if user switches pages

    // The "Smart" Typing Function
    function typeHTML(htmlText) {
        let i = 0;
        let currentHTML = ''; // <-- NEW: Store the pristine HTML here
        displayElement.innerHTML = '<span class="cursor"></span>'; 

        function type() {
            if (i < htmlText.length) {
                let char = htmlText.charAt(i);

                // --- SMART SCROLL CHECK ---
                const container = document.querySelector('.crt-content');
                const shouldAutoScroll = (container.scrollHeight - container.scrollTop - container.clientHeight) < 50;

                // --- TYPING LOGIC ---
                if (char === '<') {
                    let tag = '';
                    while (htmlText.charAt(i) !== '>' && i < htmlText.length) {
                        tag += htmlText.charAt(i);
                        i++;
                    }
                    tag += '>'; 
                    i++; 
                    
                    // Update our pristine string, THEN write to DOM
                    currentHTML += tag;
                    displayElement.innerHTML = currentHTML + '<span class="cursor"></span>';
                    
                    type(); // Recursive call (don't wait)
                } 
                else {
                    // Update our pristine string, THEN write to DOM
                    currentHTML += char;
                    i++;
                    displayElement.innerHTML = currentHTML + '<span class="cursor"></span>';
                    
                    // --- APPLY SCROLL ---
                    if (shouldAutoScroll) {
                        container.scrollTop = container.scrollHeight;
                    }

                    currentTimeout = setTimeout(type, 15);
                }
            } else {
                // The text has finished typing entirely!
                if (currentPageId === 'guestbook') {
                    loadGuestbookEntries();
                }
            }
        }
        type();
    }

    /* --- UPDATED NAVIGATION FUNCTION --- */
    function navigate(pageId) {
        currentPageId = pageId;
        // 1. Update Links (Active State)
        const links = document.querySelectorAll('.nav-link');
        links.forEach(link => {
            // Don't mess with the FX button's active state, only page links
            if (link.id !== 'anim-toggle') {
                if (link.dataset.target === pageId) link.classList.add('active');
                else link.classList.remove('active');
            }
        });

        // 2. Clear any running typing loop immediately
        if (currentTimeout) clearTimeout(currentTimeout);

        // 3. Load Content
        if (pages[pageId]) {
            if (isAnimEnabled) {
                // OPTION A: Typing Animation (Old Way)
                typeHTML(pages[pageId]);
            } else {
                // OPTION B: Instant Load (New Way)
                // Just dump the text + cursor immediately
                displayElement.innerHTML = pages[pageId] + '<span class="cursor"></span>';
                
                // Force scroll to bottom to match the typing behavior behavior
                const container = document.querySelector('.crt-content');
                container.scrollTop = container.scrollHeight;
                if (currentPageId === 'guestbook') {
                    loadGuestbookEntries();
                }
            }
        }
    }

    window.onload = function() {
        navigate('home');
    };

    // --- GUESTBOOK LOGIC ---
    async function loadGuestbookEntries() {
        const list = document.getElementById('guestbook-list');
        if (!list) return;

        try {
            const response = await fetch('/api/guestbook');
            const entries = await response.json();
        
            list.innerHTML = ''; // Clear loading text
        
            if (entries.length === 0) {
                list.innerHTML = 'NO RECORDS FOUND.';
                return;
            }

            entries.forEach(entry => {
                // Format the date
                const dateStr = new Date(entry.timestamp).toLocaleDateString();
            
                // Prevent XSS attacks by creating text nodes
                const div = document.createElement('div');
                div.className = 'guestbook-entry';
            
                const meta = document.createElement('div');
                meta.className = 'entry-meta';
                meta.innerText = `USER: ${entry.name} | DATE: ${dateStr}`;
            
                const msg = document.createElement('div');
                msg.innerText = `> ${entry.message}`;
            
                div.appendChild(meta);
                div.appendChild(msg);
                list.appendChild(div);
            });
        } catch (e) {
            list.innerHTML = 'ERROR: UNABLE TO ESTABLISH CONNECTION TO DATABASE SERVER.';
        }
    }

    async function submitGuestbook() {
        const nameInput = document.getElementById('gb-name');
        const msgInput = document.getElementById('gb-msg');
        const status = document.getElementById('gb-status');

        const name = nameInput.value.trim();
        const message = msgInput.value.trim();

        if (!name || !message) {
            status.innerText = "ERR: MISSING PARAMETERS";
            setTimeout(() => status.innerText = "", 2000);
            return;
        }

        status.innerText = "TRANSMITTING...";

        try {
            const response = await fetch('/api/guestbook', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, message })
            });

            if (response.ok) {
                status.innerText = "ACK RECEIVED.";
                nameInput.value = '';
                msgInput.value = '';
                // Reload the entries to show the new one
                loadGuestbookEntries();
                setTimeout(() => status.innerText = "", 3000);
            } else {
                status.innerText = "ERR: SERVER REJECTED.";
            }
        } catch (e) {
            status.innerText = "ERR: TX FAILED.";
        }
    }
